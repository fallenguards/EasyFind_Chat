name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nebularg/actions-luacheck@v1
        with:
          files: '.'
          args: '--no-color -q'

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.4'
      - name: Load the addon (EasyFind there or missing; an old store over the cap; a whisper hidden in a fight)
        run: |
          status=0
          for mode in normal noef old lockdown; do
            echo "== $mode"
            lua tools/tests/smoke_test.lua . EasyFind_Chat.toc EasyFind_Chat "$mode" || status=1
          done
          exit $status
