name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Addon versions
      description: EasyFind_Chat and EasyFind, from your addon list (AddOns button on the character select screen).
      placeholder: "e.g. Chat 1.0.1, EasyFind 4.0.2"
    validations:
      required: false

  - type: dropdown
    id: client
    attributes:
      label: Which game?
      options:
        - Retail
        - WoW Forever
        - Classic Era
        - TBC Anniversary
        - Mists Classic
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: Which part?
      options:
        - The chat list (folders, pinned and muted chats, unread counts, the Game group)
        - Messages (bubbles, replies, pinned messages, search)
        - Sending (the input, slash commands, use as the game's chat)
        - Whispers and Battle.net friends
        - Options / Settings
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what went wrong.
      placeholder: Tell us what you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Tell us what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: What were you doing when it happened?
      placeholder: |
        1. Open Chat
        2. Click a whisper in the list
        3. ...
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error message (if any)
      description: If you saw a Lua error, paste it here. Addons like BugSack or !BugGrabber can help capture these.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, other chat addons installed, or any other details.
    validations:
      required: false
